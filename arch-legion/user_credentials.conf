# ============================================
# EDIT THIS FILE BEFORE RUNNING ANYTHING
# ============================================

# Your desired username (lowercase, no spaces)
USERNAME="travis"

# Hostname for the machine
HOSTNAME="legion"

# Timezone (find yours: timedatectl list-timezones)
TIMEZONE="America/Vancouver"

# Locale
LOCALE="en_US.UTF-8"

# Wifi SSID and password (for post-install connectivity)
WIFI_SSID=""
WIFI_PASS=""

# Skip Nvidia setup? (set to "true" for VM testing)
SKIP_NVIDIA="true"

# Skip Legion hardware setup? (set to "true" for VM testing)
SKIP_LEGION="true"

# Set to "true" if running in VirtualBox for testing
VM_TEST_MODE="true"

# Tailscale auth key for unattended registration (optional)
# Generate at: https://login.tailscale.com/admin/settings/keys
# Leave empty to skip auto-registration (you'll need to run "sudo tailscale up" manually)
TAILSCALE_AUTHKEY=""

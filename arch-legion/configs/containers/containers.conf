[containers]
# Minimal capabilities for rootless containers
default_capabilities = [
  "CHOWN",
  "DAC_OVERRIDE",
  "FOWNER",
  "FSETID",
  "KILL",
  "NET_BIND_SERVICE",
  "SETFCAP",
  "SETGID",
  "SETPCAP",
  "SETUID",
  "SYS_CHROOT",
]

# No new privileges
no_new_privileges = true

# Default seccomp profile
seccomp_profile = "/usr/share/containers/seccomp.json"

[engine]
# Use crun for better rootless performance
runtime = "crun"

# Pull policy — always check for newer images
pull_policy = "newer"
